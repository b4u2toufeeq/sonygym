<!-- Recommended: AVIF first, WebP fallback, original only as final fallback. -->
<picture>
  <source
    type="image/avif"
    media="(max-width: 767px)"
    srcset="/images/IMAGE-mobile.avif 768w"
    sizes="100vw">
  <source
    type="image/avif"
    media="(max-width: 1279px)"
    srcset="/images/IMAGE-tablet.avif 1280w"
    sizes="100vw">
  <source
    type="image/avif"
    srcset="/images/IMAGE-desktop.avif 1920w"
    sizes="100vw">

  <source
    type="image/webp"
    media="(max-width: 767px)"
    srcset="/images/IMAGE-mobile.webp 768w"
    sizes="100vw">
  <source
    type="image/webp"
    media="(max-width: 1279px)"
    srcset="/images/IMAGE-tablet.webp 1280w"
    sizes="100vw">
  <source
    type="image/webp"
    srcset="/images/IMAGE-desktop.webp 1920w"
    sizes="100vw">

  <img
    src="/images/IMAGE-desktop.webp"
    alt="Descriptive alt text"
    width="2048"
    height="762"
    loading="lazy"
    decoding="async">
</picture>
